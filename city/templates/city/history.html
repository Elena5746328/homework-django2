
{% extends 'city/base.html' %}

{% block content %}
<h1>История Зеленоградска</h1>

<div class="history-list" style="max-width: 600px;">
    {% for item in history_items %}
        <div style="margin-bottom: 15px; border-bottom: 1px solid var(--text-color); padding-bottom: 10px;">
            <strong style="color: var(--text-color);">{{ item.year }}</strong>
            <p style="margin: 5px 0 0 0;">{{ item.event }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
