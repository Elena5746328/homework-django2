{% extends 'city/base.html' %}

{% block content %}
<h1>История Зеленоградска в фотографиях</h1>

<div class="photos-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
    {% for photo in photos %}
        <div style="text-align: center;">
            <img src="{{ photo.src }}" alt="{{ photo.caption }}" style="width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <p style="margin-top: 10px; font-weight: bold;">{{ photo.caption }}</p>
            <p style="color: #666; font-size: 0.9em;">{{ photo.year }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
