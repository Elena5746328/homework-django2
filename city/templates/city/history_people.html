{% extends 'city/base.html' %}

{% block content %}
<h1>Значимые люди Зеленоградска</h1>

<div class="people-list" style="max-width: 600px;">
    {% for person in people %}
        <div style="margin-bottom: 15px; border-bottom: 1px solid var(--text-color); padding-bottom: 10px;">
            <strong style="color: var(--text-color);">{{ person.name }}</strong>
            <p style="margin: 5px 0 0 0;">{{ person.role }} ({{ person.years }})</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
