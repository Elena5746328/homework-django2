{% extends 'city/base.html' %}

{% block content %}
<h1>Контакты</h1>

<div class="contacts-card" style="max-width: 500px; border: 1px solid var(--text-color); padding: 20px; border-radius: 8px;">
    <p><strong>Адрес:</strong> {{ contact_info.address }}</p>
    <p><strong>Телефон:</strong> {{ contact_info.phone }}</p>
    <p><strong>Email:</strong> <a href="mailto:{{ contact_info.email }}" style="color: var(--text-color);">{{ contact_info.email }}</a></p>
    <p><strong>Часы работы:</strong> {{ contact_info.working_hours }}</p>
</div>
{% endblock %}
