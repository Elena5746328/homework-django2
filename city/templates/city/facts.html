{% extends 'city/base.html' %}

{% block content %}
<h1>Интересные факты о Зеленоградске</h1>

<div class="facts-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
    {% for fact in facts %}
        <article class="fact-card" style="border: 1px solid var(--text-color); padding: 15px; border-radius: 8px;">
            <h3 style="margin-top: 0;">{{ fact.title }}</h3>
            <p>{{ fact.text }}</p>
        </article>
    {% endfor %}
</div>
{% endblock %}
